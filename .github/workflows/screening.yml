name: Screening Saham Harian

on:
  schedule:
    # Setiap hari jam 05:00 WIB (22:00 UTC hari sebelumnya)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Jalankan screening
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python screening.py
